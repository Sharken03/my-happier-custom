name: Probe node_modules cache
description: >
  Report whether install-yarn-dependencies will restore node_modules from cache, so the
  Yarn download cache is restored only when a real install follows. The key is the same
  as in .github/actions/install-yarn-dependencies; if that key changes, this probe misses
  and the only cost is one extra Yarn cache restore.

outputs:
  cache-hit:
    description: "'true' when an exact node_modules cache entry exists"
    value: ${{ steps.lookup.outputs.cache-hit }}
  yarn-cache-dir:
    description: Yarn download cache folder
    value: ${{ steps.runtime.outputs.yarn-cache-dir }}

runs:
  using: composite
  steps:
    - name: Resolve dependency cache identity
      id: runtime
      shell: bash
      run: |
        echo "node=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"
        echo "libc=$(node -p 'process.report.getReport().header.glibcVersionRuntime || "none"')" >> "$GITHUB_OUTPUT"
        scope="${HAPPIER_INSTALL_SCOPE:-}"
        echo "scope=${scope//,/+}" >> "$GITHUB_OUTPUT"
        echo "yarn-cache-dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
    - name: Look up node_modules cache
      id: lookup
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        lookup-only: true
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ steps.runtime.outputs.libc }}-default-${{ steps.runtime.outputs.scope }}-${{ hashFiles('yarn.lock', '.yarnrc*', '.node-version', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/modules/*/package.json', 'apps/*/patches/**', 'packages/*/patches/**', 'scripts/postinstall/**', 'apps/ui/tools/**', 'apps/cli/scripts/postinstall/**') }}
