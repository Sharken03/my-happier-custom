name: Build 8T APK

# Private build of an arm64 Android APK of Happier for the OnePlus 8T, with the self-hosted relay in
# HAPPIER_8T_SERVER_URL as the default server. Each run publishes one prerelease
# (8t-app-<short sha>-<run number>) and keeps the newest 3. The web export and the APK are
# separate workflows, so one does not wait for, block or cancel the other.

on:
  push:
    branches:
      - sharken/8t
    # Only what goes into the APK: an APK build takes 40-55 min on the 2-CPU runner.
    paths:
      - "apps/ui/**"
      - "!apps/ui/public/**"
      - "!**/*.md"
      - "packages/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc*"
      - ".node-version"
      - "patches/**"
      - "scripts/postinstall/**"
      - ".github/actions/**"
      - ".github/build-8t/**"
      - "!.github/build-8t/ui-tests.txt"
      - "!.github/build-8t/cli-tests.txt"
      - ".github/workflows/build-8t-app.yml"
  workflow_dispatch:

# A newer push waits for the running build instead of cancelling it (a cancelled build loses up to
# an hour); GitHub keeps only the newest waiting run.
concurrency:
  group: build-8t-app-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HAPPIER_8T_SERVER_URL: https://happy.sharken.duckdns.org
  # The app reads this at bundle time and seeds it as the primary server profile.
  EXPO_PUBLIC_HAPPIER_SERVER_URL: https://happy.sharken.duckdns.org
  APP_ENV: preview
  HAPPIER_EMBEDDED_POLICY_ENV: preview
  # Speed (happy/docs/plan-happier-app-speed.md, measured 10/11-2026): websocket only, no
  # socket.io polling handshake on each reconnect (the rpi's Caddy passes websockets). Pages of
  # 50 messages instead of 150: the transcript repair always asks for a full page, also for one
  # edited message (350-490 KB in a long Pi chat). Nine resume pages keep 450 messages of catch-up.
  EXPO_PUBLIC_HAPPIER_SOCKET_FORCE_WEBSOCKET: "1"
  EXPO_PUBLIC_HAPPIER_SYNC_TUNING_JSON: '{"sessionMessagesPageSize":50,"messageMaxIncrementalPagesOnResume":9}'
  EXPO_UNSTABLE_WEB_MODAL: "1"
  YARN_PRODUCTION: "false"
  npm_config_production: "false"
  CI: "1"

jobs:
  app:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # publish the prerelease and the 8t-buildlog snapshots
      actions: write # delete old Metro caches
    env:
      HAPPIER_INSTALL_SCOPE: ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native
      # Native builds do not need the web-only vendored assets (same as upstream mobile builds).
      HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
      EXPO_APP_NAME: Happier 8T
      EXPO_ANDROID_PACKAGE: dev.happier.app.sharken
      EXPO_APP_LOCAL_CONFIG_PATH: ${{ github.workspace }}/.github/build-8t/app.local.cjs
      HAPPIER_8T_VERSION_CODE: ${{ github.run_number }}
      HAPPIER_ANDROID_BUILD_ARCHS: arm64-v8a
      # No R8 (HAPPIER_ANDROID_ENABLE_MINIFY, ..._SHRINK_RESOURCES default off in app.config.js):
      # on the 8 GB runner it was the slowest and most memory-hungry task, for a private APK
      # where size does not matter.
      HAPPIER_ANDROID_GRADLE_JVMARGS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
      # No Sentry auth token here: the Sentry Gradle step must not try to upload source maps.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      # Runs before checkout (the free-disk action lives in the repository). The APK build writes
      # React Native's CMake trees, node_modules and android/build into the workspace, which filled
      # / twice ("No space left on device") with Gradle's home already on /mnt. When the second
      # disk at /mnt has more room, the whole workspace lives there.
      - name: Put the workspace on /mnt
        run: |
          set -euo pipefail
          df -h / /mnt 2>/dev/null || true
          # Only a second disk helps; on the 2-CPU runners of private repositories /mnt is a folder
          # on the same disk as /.
          if [ ! -d /mnt ] || [ "$(df --output=source / | tail -1)" = "$(df --output=source /mnt | tail -1)" ]; then
            echo "/mnt is on the same disk as /; the workspace stays where it is"
            exit 0
          fi
          root_free=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          mnt_free=$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/work
            sudo chown "$(id -u):$(id -g)" /mnt/work
            sudo mount --bind /mnt/work "$GITHUB_WORKSPACE"
            echo "Workspace on /mnt (${mnt_free} GB free there, ${root_free} GB on /)"
          fi
          # Temporary files and the home caches (Yarn, Android, CMake/Kotlin temp) go to /mnt too.
          if [ "${mnt_free:-0}" -gt 10 ]; then
            for d in tmp home-cache home-android; do sudo mkdir -p "/mnt/$d"; sudo chown "$(id -u):$(id -g)" "/mnt/$d"; done
            mkdir -p "$HOME/.cache" "$HOME/.android"
            sudo mount --bind /mnt/home-cache "$HOME/.cache"
            sudo mount --bind /mnt/home-android "$HOME/.android"
            echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"
            echo "JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=/mnt/tmp" >> "$GITHUB_ENV"
          fi
          df -h / /mnt 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk
        uses: ./.github/build-8t/free-disk
        with:
          keep-android-sdk: "true"
          use-mnt: "true"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Setup Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Probe node_modules cache
        id: probe
        uses: ./.github/build-8t/probe-modules-cache

      - name: Restore Yarn download cache
        id: yarn_cache
        if: ${{ steps.probe.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.probe.outputs.yarn-cache-dir }}
          key: yarn-cache-v1-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      # Only the APK workflow saves the Yarn cache, and only after a real install, so the two
      # workflows do not race for one key and a node_modules hit does not upload it again.
      - name: Save Yarn download cache
        if: ${{ steps.probe.outputs.cache-hit != 'true' && steps.yarn_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.probe.outputs.yarn-cache-dir }}
          key: yarn-cache-v1-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # The download cache is ~12 GB unpacked and nothing after the install reads it; with it on
      # disk the native build filled / (run 42499987970: 98 % full in the CMake tasks).
      - name: Drop the Yarn download cache
        run: rm -rf "${{ steps.probe.outputs.yarn-cache-dir }}" && df -h /

      # ccache for the native libraries' C++ (~10 min of CMake per build). CMake 3.17+ takes the
      # launcher from these variables; base dir and sloppiness let hits survive new checkouts.
      - name: Set up ccache
        run: |
          set -euo pipefail
          # The runner's package mirror sometimes does not resolve. Try three times; without ccache
          # the build still works, about 10 min slower.
          for attempt in 1 2 3; do
            command -v ccache >/dev/null && break
            { sudo apt-get update -qq && sudo apt-get install -y -qq ccache >/dev/null; } || sleep 20
          done
          if ! command -v ccache >/dev/null; then
            echo "::warning::ccache is not available; building without it"
            exit 0
          fi
          {
            echo "CCACHE_DIR=$HOME/.ccache-8t"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            echo "CCACHE_MAXSIZE=2G"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.ccache-8t
          key: ccache-app-v1-${{ github.run_id }}
          restore-keys: ccache-app-v1-

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The MIT provider on actions/cache; its key hashes all *.gradle files, node_modules included.
          cache-provider: basic
          # The build branch is not the default branch; without this the cache is never written.
          cache-read-only: false

      - name: Restore Metro cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/metro-cache
          key: metro-app-v1-${{ hashFiles('yarn.lock', 'apps/ui/babel.config.js', 'apps/ui/metro.config.js', 'apps/ui/patches/**', '.github/workflows/build-8t-app.yml') }}-${{ github.run_id }}
          restore-keys: metro-app-v1-${{ hashFiles('yarn.lock', 'apps/ui/babel.config.js', 'apps/ui/metro.config.js', 'apps/ui/patches/**', '.github/workflows/build-8t-app.yml') }}-

      # prepareSherpaOnnxAndroid downloads only the files that are missing from this directory.
      - name: Restore sherpa-onnx download
        id: sherpa-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: packages/sherpa-native/android/build/sherpa-onnx/v1.12.25
          key: sherpa-onnx-android-v1.12.25

      # The release download URL for checksum.txt gave HTTP 504 on 2026-11-09; the API route worked.
      - name: Download sherpa-onnx through the GitHub API
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir=packages/sherpa-native/android/build/sherpa-onnx/v1.12.25
          mkdir -p "$dir"
          for attempt in 1 2 3 4; do
            if gh release download v1.12.25 -R k2-fsa/sherpa-onnx --clobber -D "$dir" \
                -p checksum.txt -p sherpa-onnx-v1.12.25-android.tar.bz2; then
              exit 0
            fi
            echo "Download attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          # Gradle tries the release URLs itself when the files are missing.
          rm -f "$dir"/checksum.txt "$dir"/sherpa-onnx-v1.12.25-android.tar.bz2

      - name: Build workspace packages used by the UI
        run: node apps/ui/scripts/ensureWorkspacePackagesBuilt.mjs

      - name: Add a google-services.json client for the 8T package
        run: |
          set -euo pipefail
          # The Google Services Gradle plugin fails when no client matches the applicationId.
          # Copy the preview client under the 8T package name. Push through FCM is not expected to work.
          out="$RUNNER_TEMP/google-services.json"
          jq --arg pkg "$EXPO_ANDROID_PACKAGE" '
            .client += [
              .client[]
              | select(.client_info.android_client_info.package_name == "dev.happier.app.preview")
              | .client_info.android_client_info.package_name = $pkg
            ]' apps/ui/google-services.json > "$out"
          test "$(jq --arg pkg "$EXPO_ANDROID_PACKAGE" '[.client[] | select(.client_info.android_client_info.package_name == $pkg)] | length' "$out")" = 1
          echo "HAPPIER_8T_GOOGLE_SERVICES_FILE=$out" >> "$GITHUB_ENV"

      - name: Expo prebuild (android)
        working-directory: apps/ui
        run: |
          set -euo pipefail
          yarn -s expo prebuild --platform android --no-install
          {
            echo "org.gradle.caching=true"
            # One JVM instead of a separate Kotlin daemon keeps memory within the runner.
            echo "kotlin.compiler.execution.strategy=in-process"
          } >> android/gradle.properties
          grep -E '^(org\.gradle\.jvmargs|reactNativeArchitectures|android\.enable|org\.gradle\.caching|kotlin\.compiler)' android/gradle.properties

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning title=Debug signing::Repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (and optionally ANDROID_KEY_PASSWORD) are not set. The APK is signed with the Expo template debug keystore."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "HAPPIER_8T_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          # A second android {} block overrides the template's debug signing for release.
          cat >> apps/ui/android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  sharken8t {
                      storeFile file(System.getenv("HAPPIER_8T_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword(System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD"))
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.sharken8t
                  }
              }
          }
          GRADLE
          echo "mode=release-keystore" >> "$GITHUB_OUTPUT"

      - name: Cap Gradle and Kotlin memory
        run: |
          set -euo pipefail
          # Sized by the runner: a public repository gets 4 CPUs and 16 GB, a private one 2 CPUs and
          # 8 GB, where bounded heaps and two workers keep Gradle, the Kotlin daemon, CMake and the
          # JS bundling within memory (it died there before).
          home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$home"
          cpus=$(nproc)
          mem_gb=$(awk '/MemTotal/ { printf "%d", $2 / 1048576 }' /proc/meminfo)
          if [ "$cpus" -ge 4 ] && [ "$mem_gb" -ge 14 ]; then
            heap=6g; kotlin_heap=3g; workers=$cpus
          else
            heap=4g; kotlin_heap=2g; workers=2
          fi
          echo "runner: ${cpus} CPUs, ${mem_gb} GB"
          {
            echo "org.gradle.jvmargs=-Xmx${heap} -XX:MaxMetaspaceSize=1g"
            echo "kotlin.daemon.jvmargs=-Xmx${kotlin_heap}"
            echo "org.gradle.workers.max=${workers}"
          } >> "$home/gradle.properties"
          cat "$home/gradle.properties"

      - name: Gradle assembleRelease
        working-directory: apps/ui/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }} # build-log snapshots only
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Disk guard: three runs died with "No space left on device" and no log. Below 3 GB free
          # on /, show what fills it and stop Gradle, so the step fails with a readable log.
          (
            n=0
            while sleep 20; do
              n=$((n + 1))
              free_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
              [ $((n % 15)) -eq 0 ] && echo "disk guard: ${free_gb} GB free on /" && df -h / /mnt
              if [ "$free_gb" -lt 3 ]; then
                echo "::error title=Disk full::Only ${free_gb} GB free on /; stopping Gradle to keep the log"
                df -h / /mnt
                sudo du -xh --max-depth=4 / 2>/dev/null | sort -h | tail -40
                ./gradlew --stop || true
                pkill -f GradleDaemon || true
                exit 0
              fi
            done
          ) &
          guard=$!
          # Log snapshots: the runner has died twice mid-build ("lost communication") and took the
          # log with it. Every 2 minutes the Gradle log tail and a memory/process snapshot go to
          # the release 8t-buildlog, which outlives the runner.
          gh release view 8t-buildlog >/dev/null 2>&1 \
            || gh release create 8t-buildlog --prerelease --title "8T build log snapshots" --notes "Diagnostics of the APK job." >/dev/null
          (
            while sleep 120; do
              {
                date -u; uptime; free -m; swapon --show; df -h / /mnt
                ps -eo rss,pcpu,etime,args --sort=-rss | head -15 | cut -c1-200
                echo "--- gradle log tail"; tail -n 150 "$RUNNER_TEMP/gradle.log"
              } > "$RUNNER_TEMP/apk-snapshot.txt" 2>&1
              gh release upload 8t-buildlog "$RUNNER_TEMP/apk-snapshot.txt" --clobber >/dev/null 2>&1 || true
            done
          ) &
          snapshots=$!
          ./gradlew :app:assembleRelease \
            -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --build-cache --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          kill "$guard" "$snapshots" 2>/dev/null || true
          du -sh /tmp/metro-cache 2>/dev/null || echo "No Metro cache at /tmp/metro-cache"
          ccache --show-stats || true

      - name: Verify and stage APK
        id: verify
        run: |
          set -euo pipefail
          apk="$(find apps/ui/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$build_tools/aapt2" dump badging "$apk" | grep -E "^(package|application-label|native-code):"
          "$build_tools/aapt2" dump badging "$apk" | grep -q "^package: name='$EXPO_ANDROID_PACKAGE'"
          "$build_tools/aapt2" dump badging "$apk" | grep -q "^native-code: 'arm64-v8a'$"
          certs="$("$build_tools/apksigner" verify --print-certs "$apk")"
          echo "$certs"
          echo "cert_sha256=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)" >> "$GITHUB_OUTPUT"
          mkdir -p dist/8t
          cp "$apk" "dist/8t/happier-8t-${GITHUB_SHA::7}-arm64-v8a.apk"
          ls -l dist/8t

      - name: Publish
        uses: ./.github/build-8t/publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          kind: app
          path: dist/8t
          title: Happier 8T APK
          notes: |
            - Android APK (arm64-v8a, ${{ env.EXPO_ANDROID_PACKAGE }}, "${{ env.EXPO_APP_NAME }}")
            - APK signing: ${{ steps.signing.outputs.mode }} (certificate SHA-256 ${{ steps.verify.outputs.cert_sha256 }})
