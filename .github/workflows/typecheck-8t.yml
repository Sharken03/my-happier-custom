name: Typecheck 8T

# Typecheck of apps/ui on a GitHub runner, for work done on the OnePlus 8T. The full typecheck
# needs about 2.2 GB; on the phone, Android then kills all of Termux (12/11-2026), so it runs here.
# It checks the pushed commit of the ref, not uncommitted changes in the phone's checkout.
#
# Start it with:  gh workflow run typecheck-8t.yml -R Sharken03/my-happier-custom --ref <branch>
# Own concurrency group, so it never waits for, blocks or cancels the web, APK or CLI builds.
# cancel-in-progress is off: a second dispatch for the same ref waits instead of cancelling a run
# that another session is watching.

on:
  workflow_dispatch:

concurrency:
  group: typecheck-8t-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  YARN_PRODUCTION: "false"
  npm_config_production: "false"
  CI: "1"

jobs:
  typecheck:
    name: Typecheck apps/ui
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Same scope as Build 8T web, so the two share the node_modules cache.
      HAPPIER_INSTALL_SCOPE: ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk
        uses: ./.github/build-8t/free-disk

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Probe node_modules cache
        id: probe
        uses: ./.github/build-8t/probe-modules-cache

      - name: Restore Yarn download cache
        if: ${{ steps.probe.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.probe.outputs.yarn-cache-dir }}
          key: yarn-cache-v1-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Typecheck apps/ui
        working-directory: apps/ui
        run: yarn -s typecheck
