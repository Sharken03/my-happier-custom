name: Build web

# Private build of the Happier web UI for the OnePlus 8T, with the self-hosted relay in
# HAPPIER_8T_SERVER_URL as the default server. Each run publishes one prerelease
# (8t-web-<short sha>-<run number>) and keeps the newest 3. The web export and the APK are
# separate workflows, so one does not wait for, block or cancel the other.

on:
  push:
    branches:
      - sharken/8t
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "termux/**"
      - ".github/workflows/build-app.yml"
      - ".github/build-8t/app.local.cjs"
      - ".github/workflows/build-cli.yml"
      - "apps/cli/**"
      - ".github/build-8t/cli-tests.txt"
      - "apps/server/**"
  workflow_dispatch:

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HAPPIER_8T_SERVER_URL: https://happy.sharken.duckdns.org
  # The app reads this at bundle time and seeds it as the primary server profile.
  EXPO_PUBLIC_HAPPIER_SERVER_URL: https://happy.sharken.duckdns.org
  APP_ENV: preview
  HAPPIER_EMBEDDED_POLICY_ENV: preview
  # Speed (happy/docs/plan-happier-app-speed.md, measured 10/11-2026): websocket only, no
  # socket.io polling handshake on each reconnect (the rpi's Caddy passes websockets). Pages of
  # 50 messages instead of 150: the transcript repair always asks for a full page, also for one
  # edited message (350-490 KB in a long Pi chat). Nine resume pages keep 450 messages of catch-up.
  EXPO_PUBLIC_HAPPIER_SOCKET_FORCE_WEBSOCKET: "1"
  EXPO_PUBLIC_HAPPIER_SYNC_TUNING_JSON: '{"sessionMessagesPageSize":50,"messageMaxIncrementalPagesOnResume":9}'
  EXPO_UNSTABLE_WEB_MODAL: "1"
  YARN_PRODUCTION: "false"
  npm_config_production: "false"
  CI: "1"

jobs:
  web:
    name: Web export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # publish the prerelease
      actions: write # delete old Metro caches
    env:
      # One token less than the app scope, so the two workflows keep separate node_modules caches.
      HAPPIER_INSTALL_SCOPE: ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor
    steps:
      # The workflows were renamed on 12/11-2026, so run_number restarted at 1. The offset keeps
      # the web version and release tags above the builds from before (#60).
      - name: Set the build number
        run: |
          n=$((GITHUB_RUN_NUMBER + 100))
          echo "HAPPIER_BUILD_NUMBER=$n" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk
        uses: ./.github/build-8t/free-disk

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Probe node_modules cache
        id: probe
        uses: ./.github/build-8t/probe-modules-cache

      - name: Restore Yarn download cache
        if: ${{ steps.probe.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.probe.outputs.yarn-cache-dir }}
          key: yarn-cache-v1-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      # The fork's UI changes are written on the phone, which has no dependencies to check them.
      - name: Check the UI (typecheck and the fork tests)
        working-directory: apps/ui
        run: |
          set -euo pipefail
          yarn -s typecheck
          mapfile -t tests < <(grep -v '^#' ../../.github/build-8t/ui-tests.txt | sed '/^$/d')
          yarn -s vitest run --config vitest.config.ts "${tests[@]}"

      - name: Restore Metro cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/metro-cache
          key: metro-web-v1-${{ hashFiles('yarn.lock', 'apps/ui/babel.config.js', 'apps/ui/metro.config.js', 'apps/ui/patches/**', '.github/workflows/build-web.yml') }}-${{ github.run_id }}
          restore-keys: metro-web-v1-${{ hashFiles('yarn.lock', 'apps/ui/babel.config.js', 'apps/ui/metro.config.js', 'apps/ui/patches/**', '.github/workflows/build-web.yml') }}-

      - name: Export web bundle
        id: web
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/ui/package.json').version")-8t.${HAPPIER_BUILD_NUMBER}"
          node scripts/pipeline/release/build-ui-web-bundle.mjs --channel preview --version "$version"
          archive="$(find dist/release-assets/ui-web -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p dist/8t
          cp "$archive" dist/8t/
          ls -l dist/8t
          du -sh /tmp/metro-cache 2>/dev/null || echo "No Metro cache at /tmp/metro-cache"

      - name: Publish
        id: publish
        uses: ./.github/build-8t/publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          kind: web
          path: dist/8t
          title: Happier web
          notes: "- Web export (ui-web archive for the relay's HAPPIER_SERVER_UI_DIR)"

      # A failed Publish keeps the files as an artifact, so the build is not lost.
      - name: Keep the files when Publish fails
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-${{ github.sha }}
          path: dist/8t
          retention-days: 7
