name: Install Yarn Dependencies
description: Restore workspace dependencies and install with retry handling on cache misses

inputs:
  args:
    description: Arguments forwarded to yarn install before standard CI resilience flags
    required: false
    default: --frozen-lockfile --ignore-engines
  save-cache:
    description: >
      'false' restores node_modules from cache but never saves it. The 8T builds pass 'false'
      outside sharken/8t, so side-branch builds do not evict that branch's caches (10 GB limit).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve dependency cache identity
      id: runtime
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.args }}
      run: |
        echo "node=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"
        # Native addons built on a newer glibc cannot load on an older Linux runner.
        echo "libc=$(node -p 'process.report.getReport().header.glibcVersionRuntime || "none"')" >> "$GITHUB_OUTPUT"
        # Key on the flags that change the installed tree. --frozen-lockfile and --ignore-engines
        # only validate, so installs that differ by them share one modules cache entry.
        tree=default
        for flag in $INSTALL_ARGS; do
          case "$flag" in
            --frozen-lockfile|--ignore-engines) ;;
            *) tree="$tree+$flag" ;;
          esac
        done
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
        # Cache keys cannot contain commas; scoped installs list packages comma-separated.
        scope="${HAPPIER_INSTALL_SCOPE:-}"
        echo "scope=${scope//,/+}" >> "$GITHUB_OUTPUT"
    - name: Restore installed dependencies
      id: dependencies
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        # Exact keys only: never restore a tree installed for another lockfile,
        # patch set, Node runtime, libc ABI, architecture, or install scope.
        key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ steps.runtime.outputs.libc }}-${{ steps.runtime.outputs.tree }}-${{ steps.runtime.outputs.scope }}-${{ hashFiles('yarn.lock', '.yarnrc*', '.node-version', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/modules/*/package.json', 'apps/*/patches/**', 'packages/*/patches/**', 'scripts/postinstall/**', 'apps/ui/tools/**', 'apps/cli/scripts/postinstall/**', 'scripts/ci/dependency-cache-manifest.mjs') }}
    - name: Verify the restored modules cache manifest
      id: cache-manifest
      if: steps.dependencies.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -uo pipefail
        # A structural fingerprint of the saved tree, not a yarn install: yarn v1 never
        # reports this workspace repo's restored tree as up to date, so its check would
        # re-link everything (~5 min) on every hit. Exit 2 means the entry predates the
        # manifest; the cache key covers this script, so that cannot happen after a change.
        #
        # `|| true` is load-bearing: the runner shell keeps `-e`, so without it exit 1 on a
        # real mismatch would fail the job instead of routing it to the repair path.
        node scripts/ci/dependency-cache-manifest.mjs verify --github-output || true

    - name: Drop restored workspace bundle copies
      if: steps.dependencies.outputs.cache-hit == 'true' && steps.cache-manifest.outputs.matches != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # apps/*/node_modules/@happier-dev holds bundled workspace copies written by builds and
        # packing, never by yarn install. The cache key covers only manifests, so a restored copy can
        # predate the current source, and app sources resolve it before the workspace package.
        # Removing it leaves the tree a fresh install produces; third-party packages stay cached.
        rm -rf apps/*/node_modules/@happier-dev
    - name: Restore the workspace setup (and repair the tree only if the manifest did not match)
      if: steps.dependencies.outputs.cache-hit == 'true'
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        # Same registry pin as yarn-install-with-retry.sh: dodge yarnpkg.com 5xx throttling.
        # (Composite-action env keys are case-insensitive, so only one of the two casings.)
        npm_config_registry: https://registry.npmjs.org/
      run: |
        set -euo pipefail
        if [ "${{ steps.cache-manifest.outputs.matches }}" = "true" ]; then
          # The restored tree is byte-for-byte the post-install snapshot that was saved:
          # same folders, same symlink targets, same .yarn-integrity. yarn install would
          # rebuild exactly this and cost minutes, so only the postinstall outputs that
          # live outside node_modules are refreshed below.
          echo "Restored modules tree matches its saved manifest; skipping yarn install."
        elif yarn install ${{ inputs.args }} --network-timeout 600000 --prefer-offline --non-interactive; then
          echo "Repaired the restored modules tree without the canonical installer retry."
        else
          echo "::warning::Restored modules tree failed verification; repairing with the canonical installer. "
          echo "::warning::This cache entry stays stale: delete it with gh cache delete and let the next miss recreate it."
          bash scripts/ci/yarn-install-with-retry.sh ${{ inputs.args }} --network-timeout 600000 --prefer-offline --non-interactive
        fi
        # Yarn's no-op install does not regenerate outputs outside node_modules.
        # Delegate that setup to the same workspace postinstall owners as a miss.
        node scripts/ci/refresh-workspace-postinstall.mjs ${{ inputs.args }}
    - name: Install dependencies with retry
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        # Same registry pin as yarn-install-with-retry.sh: dodge yarnpkg.com 5xx throttling.
        # (Composite-action env keys are case-insensitive, so only one of the two casings.)
        npm_config_registry: https://registry.npmjs.org/
      run: |
        set -euo pipefail
        bash scripts/ci/yarn-install-with-retry.sh ${{ inputs.args }} --network-timeout 600000 --prefer-offline --non-interactive
    # The manifest is what a hit costs: one directory walk instead of a full install.
    # It has to be written after the install and before the save, so the cached tree and
    # the fingerprint travel together; a failure here skips the save rather than caching
    # a tree that no later run can verify.
    - name: Write the modules cache manifest
      if: steps.dependencies.outputs.cache-hit != 'true' && inputs.save-cache != 'false'
      shell: bash
      run: node scripts/ci/dependency-cache-manifest.mjs write
    - name: Save installed dependencies
      if: steps.dependencies.outputs.cache-hit != 'true' && inputs.save-cache != 'false'
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
